<!DOCTYPE html>
<html>
<head>
    <title>AR Ship Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">Loading...</div>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        const info = document.getElementById('info');
        let camera, scene, renderer;
        let controller;
        let reticle;
        let shipModel = null;
        let shipContainer = new THREE.Group();
        let hasPlaced = false;

        // Check WebXR support
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar')
                .then((supported) => {
                    if (supported) {
                        info.textContent = 'AR is supported! Starting initialization...';
                        init();
                    } else {
                        info.textContent = 'AR not supported on this device/browser';
                    }
                })
                .catch(err => {
                    info.textContent = 'Error checking AR support: ' + err;
                });
        } else {
            info.textContent = 'WebXR not available in this browser';
        }

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            const light = new THREE.DirectionalLight(0xffffff, 2);
            light.position.set(1, 1, 1);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 1));

            // Create reticle
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial()
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Create ship container
            scene.add(shipContainer);

            // Create water plane
            const waterGeometry = new THREE.PlaneGeometry(1, 1);
            const waterMaterial = new THREE.MeshStandardMaterial({
                color: 0x0077be,
                transparent: true,
                opacity: 0.7,
                metalness: 0.8,
                roughness: 0.2
            });
            const waterPlane = new THREE.Mesh(waterGeometry, waterMaterial);
            waterPlane.rotation.x = -Math.PI / 2;
            shipContainer.add(waterPlane);

            // Load ship model
            try {
                info.textContent = 'Loading 3D model...';
                const mtlLoader = new MTLLoader();
                const materials = await new Promise((resolve, reject) => {
                    mtlLoader.load(
                        'models/LPG_Tanker_Ship.mtl',
                        resolve,
                        undefined,
                        reject
                    );
                });

                materials.preload();
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);

                shipModel = await new Promise((resolve, reject) => {
                    objLoader.load(
                        'models/LPG_Tanker_Ship.obj',
                        resolve,
                        undefined,
                        reject
                    );
                });

                shipModel.scale.set(0.02, 0.02, 0.02);
                shipModel.rotation.x = -Math.PI / 2;
                shipModel.position.y = 0.05; // Lift slightly above water
                shipContainer.add(shipModel);
                shipContainer.visible = false;
                
                info.textContent = 'Model loaded successfully!';
            } catch (error) {
                info.textContent = 'Error loading model: ' + error;
                console.error('Error loading model:', error);
                return;
            }

            // AR Setup
            try {
                const button = ARButton.createButton(renderer, {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: document.body }
                });
                document.body.appendChild(button);
                info.textContent = 'AR ready! Click "Start AR" to begin';
            } catch (error) {
                info.textContent = 'Error setting up AR: ' + error;
                console.error('Error setting up AR:', error);
                return;
            }

            // Controller
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onSelect() {
            if (reticle.visible && !hasPlaced) {
                // Copy reticle's position and rotation
                shipContainer.position.setFromMatrixPosition(reticle.matrix);
                shipContainer.quaternion.setFromRotationMatrix(reticle.matrix);
                shipContainer.visible = true;
                hasPlaced = true;
                info.textContent = 'Ship placed! The water surface will follow the detected plane';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        let hitTestSource = null;
        let hitTestSourceRequested = false;

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                    info.textContent = 'Looking for surfaces...';
                }

                if (hitTestSource && !hasPlaced) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                        info.textContent = 'Surface found! Tap to place ship';
                    } else {
                        reticle.visible = false;
                        info.textContent = 'Move your device to find a surface';
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
