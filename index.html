<!DOCTYPE html>
<html>
<head>
    <title>Ship AR Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        .arjs-loader {
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .arjs-loader div {
            color: white;
            text-align: center;
            font-size: 1.25em;
        }
    </style>
    <script>
        AFRAME.registerComponent('water-material', {
            init: function() {
                this.el.setAttribute('material', {
                    color: '#4286f4',
                    opacity: 0.8,
                    transparent: true,
                    metalness: 0.6,
                    roughness: 0.2
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
        <div>Loading AR experience... Please wait...</div>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">

        <!-- Water surface -->
        <a-plane
            position="0 -0.5 0"
            rotation="-90 0 0"
            width="4"
            height="4"
            water-material
            animation="property: components.material.material.opacity; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; from: 0.6; to: 0.8">
        </a-plane>

        <!-- Load the 3D model -->
        <a-entity
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.05 0.05 0.05"
            obj-model="obj: url(models/LPG_Tanker_Ship.obj); mtl: url(models/LPG_Tanker_Ship.mtl)"
            animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; from: 0 0 0; to: 0 0.05 0">
        </a-entity>

        <!-- AR marker -->
        <a-marker-camera preset="hiro"></a-marker-camera>
    </a-scene>
</body>
</html>
